services:
  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_POSTGRES_URL=postgresql+psycopg://postgres:postgres@postgres:5432/tradingagents_equity
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - postgres
    tty: true
    stdin_open: true

  postgres:
    image: paradedb/paradedb:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradingagents_equity
    volumes:
      - tradingagents_postgres_data:/var/lib/postgresql
      - ./scripts/setup_paradedb.sql:/docker-entrypoint-initdb.d/10-setup_paradedb.sql:ro

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - TRADINGAGENTS_POSTGRES_URL=postgresql+psycopg://postgres:postgres@postgres:5432/tradingagents_equity
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
      - postgres
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  tradingagents_postgres_data:
  ollama_data:
